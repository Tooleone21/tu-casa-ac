<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu Casa A.C.</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf7f0;color:#45382f;font:17px system-ui,sans-serif}header{background:white;border-bottom:1px solid #e1d5ca;position:sticky;top:0;z-index:1}.head{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px}.logo{font-size:22px;font-weight:800;color:#b95f48;cursor:pointer}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#9d4935;text-decoration:underline;cursor:pointer}nav a{text-decoration:none;color:#45382f;font-size:14px}button{background:#b95f48;color:white;border:0;padding:13px 19px;border-radius:10px;font-weight:700;cursor:pointer}button.alt{background:#fff;color:#8d4935}button.small{padding:7px 12px}main{max-width:1150px;margin:35px auto;min-height:65vh;padding:0 18px}h1{font-size:clamp(30px,4vw,49px)}h2{font-size:22px}.hero{background:#f1dfd1;border-radius:20px;padding:55px 35px}.hero p{max-width:650px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:25px 0}article{background:#fff;border:1px solid #e0d4ca;border-radius:16px;padding:23px;min-height:190px}.placeholder{height:140px;background:#f1dfd1;border-radius:12px;display:grid;place-items:center;color:#826e60}.placeholder.wide{height:260px}input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;padding:12px;border:1px solid #cfc2b7;border-radius:8px;margin:8px 0;font:inherit}textarea{min-height:100px}footer{background:#45382f;color:white;padding:26px;text-align:center}footer a{color:#fff}#toast{position:fixed;bottom:18px;right:18px;background:#45382f;color:white;padding:16px;border-radius:10px;display:none}@media(max-width:760px){.head{flex-wrap:wrap}nav{order:3;width:100%}.hero{padding:30px 20px}}</style></head><body><header><div class="head"><div class="logo" data-go="Inicio">♡ TU CASA A.C.</div><nav><a data-go="Inicio">Inicio</a><a data-go="Nosotros">Nosotros</a><a data-go="Cómo ayudar">Cómo ayudar</a><a data-go="Noticias">Noticias</a><a data-go="Transparencia">Transparencia</a><a data-go="Contacto">Contacto</a></nav><button data-go="Cómo ayudar">DONAR</button></div></header><main id="view"></main><footer>Tu Casa A.C. · <a data-go="Contacto">Contacto</a> · <a data-go="Aviso de privacidad">Aviso de privacidad</a> · <a data-go="Transparencia">Transparencia</a><p>Prototipo académico. No se reciben donaciones ni mensajes reales.</p></footer><div id="toast" role="status"></div><script type="application/json" id="pages">{"Inicio": "<div class=\"hero\"><h1>Un hogar lleno de oportunidades<\/h1><p>Tu apoyo puede ayudar a construir un entorno seguro, cercano y lleno de posibilidades.<\/p><button data-go=\"Cómo ayudar\">Donar mensualmente<\/button> <button class=\"alt\" data-go=\"Nosotros\">Conoce nuestra labor<\/button><\/div><div class=\"cards\"><article><h2>Cómo ayudar<\/h2><p>Apoya con una aportación o donativos en especie.<\/p><a data-go=\"Cómo ayudar\">Conoce las opciones<\/a><\/article><article><h2>Últimas noticias<\/h2><p>Actividades y avances de la casa hogar.<\/p><a data-go=\"Noticias\">Leer noticias<\/a><\/article><article><h2>Transparencia<\/h2><p>Información institucional y documentos.<\/p><a data-go=\"Transparencia\">Consultar<\/a><\/article><\/div>", "Nosotros": "<h1>Conócenos<\/h1><div class=\"cards\"><article><h2>Nuestra historia<\/h2><p>Espacio reservado para la historia autorizada de Tu Casa A.C.<\/p><\/article><article><h2>Misión y visión<\/h2><p>Brindar cuidado, acompañamiento y oportunidades de desarrollo.<\/p><\/article><article><h2>Valores<\/h2><p>Respeto, solidaridad, dignidad y confianza.<\/p><\/article><\/div>", "Cómo ayudar": "<h1>Tu ayuda transforma vidas<\/h1><div class=\"cards\"><article><h2>Donación económica<\/h2><p>Selecciona una modalidad.<\/p><label><input type=\"radio\" name=\"tipo\" checked> Mensual<\/label> <label><input type=\"radio\" name=\"tipo\"> Única<\/label><p><select><option>$200 MXN<\/option><option>$500 MXN<\/option><option>Otro monto<\/option><\/select><\/p><button id=\"fakeDonate\">Continuar<\/button><\/article><article><h2>Donación en especie<\/h2><p>Consulta necesidades actualizadas con la administración antes de entregar artículos.<\/p><\/article><article><h2>Voluntariado<\/h2><p>Contáctanos para conocer los requisitos.<\/p><a data-go=\"Contacto\">Quiero participar<\/a><\/article><\/div><p><a data-go=\"Proyecto solidario\">Ver proyecto solidario →<\/a><\/p>", "Proyecto solidario": "<h1>Proyecto solidario: Espacios para aprender<\/h1><div class=\"cards\"><article><h2>Descripción<\/h2><p>Campaña ficticia de ejemplo. Objetivo, presupuesto y avances por confirmar con la asociación.<\/p><\/article><article><h2>Cómo participar<\/h2><p>Consulta las necesidades y el destino previsto de los recursos.<\/p><button data-go=\"Cómo ayudar\">Quiero contribuir<\/button><\/article><\/div>", "Noticias": "<h1>Noticias y actividades<\/h1><div class=\"cards\"><article><div class=\"placeholder\">Imagen ilustrativa<\/div><small>Fecha por confirmar<\/small><h2>Noticia de ejemplo 1<\/h2><p>Resumen demostrativo de una actividad institucional.<\/p><a data-go=\"Noticia individual\">Leer noticia<\/a><\/article><article><div class=\"placeholder\">Imagen ilustrativa<\/div><small>Fecha por confirmar<\/small><h2>Noticia de ejemplo 2<\/h2><p>Resumen demostrativo de una actividad institucional.<\/p><a data-go=\"Noticia individual\">Leer noticia<\/a><\/article><article><div class=\"placeholder\">Imagen ilustrativa<\/div><small>Fecha por confirmar<\/small><h2>Noticia de ejemplo 3<\/h2><p>Resumen demostrativo de una actividad institucional.<\/p><a data-go=\"Noticia individual\">Leer noticia<\/a><\/article><\/div><p>Páginas: <button class=\"small\" id=\"paginate\">1 | 2 | 3<\/button><\/p>", "Noticia individual": "<h1>Noticia de ejemplo<\/h1><p><small>Fecha por confirmar<\/small><\/p><div class=\"placeholder wide\">Imagen ilustrativa<\/div><p>Contenido de muestra pendiente de revisión y aprobación por la asociación. No incluir datos que permitan identificar a menores.<\/p><a data-go=\"Noticias\">← Volver a noticias<\/a> · <a data-go=\"Cómo ayudar\">Cómo ayudar<\/a>", "Transparencia": "<h1>Transparencia<\/h1><div class=\"cards\"><article><h2>Informes anuales<\/h2><p>Archivos por proporcionar.<\/p><\/article><article><h2>Documentos institucionales<\/h2><p>Información legal por validar.<\/p><\/article><article><h2>Preguntas frecuentes<\/h2><p>¿Cómo se destinan los donativos? Información pendiente de confirmar.<\/p><\/article><\/div>", "Contacto": "<h1>Contáctanos<\/h1><div class=\"cards\"><article><h2>Envíanos un mensaje<\/h2><form id=\"contact\"><input required placeholder=\"Nombre\"><input type=\"email\" required placeholder=\"Correo electrónico\"><input required placeholder=\"Asunto\"><textarea required placeholder=\"Mensaje\"><\/textarea><label><input type=\"checkbox\" required> He leído el <a data-go=\"Aviso de privacidad\">aviso de privacidad<\/a><\/label><p><button type=\"submit\">Enviar mensaje<\/button><\/p><\/form><\/article><article><h2>Medios de atención<\/h2><p>Correo, teléfono, dirección y horarios por confirmar.<\/p><\/article><\/div>", "Aviso de privacidad": "<h1>Aviso de privacidad<\/h1><article><h2>Información preliminar<\/h2><p>El contenido legal definitivo requiere validación con la asociación. Deberá informar responsable, datos recabados, finalidades, medios para ejercer derechos ARCO y mecanismos de contacto.<\/p><\/article>"}</script><script>const pages=JSON.parse(document.getElementById('pages').textContent);function go(name){document.getElementById('view').innerHTML=pages[name]||pages.Inicio;document.title=name+' | Tu Casa A.C.';history.replaceState(null,'','#'+encodeURIComponent(name));window.scrollTo(0,0)}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}document.addEventListener('click',e=>{const x=e.target.closest('[data-go]');if(x){e.preventDefault();go(x.dataset.go)}if(e.target.id==='fakeDonate')toast('Demostración: no se procesan pagos.');if(e.target.id==='paginate')toast('Paginación demostrativa: contenido por cargar.')});document.addEventListener('submit',e=>{if(e.target.id==='contact'){e.preventDefault();toast('Mensaje simulado. No se ha enviado ningún dato.');e.target.reset()}});go(decodeURIComponent(location.hash.slice(1))||'Inicio');</script></body></html>
